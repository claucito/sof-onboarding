# Preview de apps/checklist-saas en Vercel (HTTPS).
# Requiere proyecto Vercel con Root Directory = apps/checklist-saas y variables
# DATABASE_URL + AUTH_SECRET en el panel (Preview). Opcional: mismos secretos en GitHub
# si preferís inyectarlos aquí en lugar del dashboard.
name: Deploy checklist-saas (Vercel preview)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Deploy to Vercel (preview)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: apps/checklist-saas
